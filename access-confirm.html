<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Different Way Forward</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(50,70,95,.14),
            transparent 42%
        ),
        #090b0f;

    color: #e8edf2;

    font-family: Arial, sans-serif;
}

.panel {
    width: min(600px,100%);

    padding: 45px 40px;

    text-align: center;

    border:
        1px solid rgba(165,180,195,.15);

    background:
        linear-gradient(
            145deg,
            rgba(20,25,32,.76),
            rgba(11,14,19,.76)
        );

    box-shadow:
        0 35px 100px rgba(0,0,0,.45);
}

.symbol {
    margin-bottom: 20px;

    color: #b7c1ca;

    font-size: 27px;
}

.eyebrow {
    margin-bottom: 14px;

    color: #707c88;

    font-size: 10px;
    letter-spacing: 3px;
}

h1 {
    margin: 0 0 16px;

    font-family: Georgia, serif;
    font-size: 37px;
    font-weight: 400;
}

p {
    max-width: 450px;

    margin: 0 auto;

    color: #8d98a4;

    font-size: 13px;
    line-height: 1.85;
}

.actions {
    display: flex;
    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

    margin-top: 32px;
}

button {
    min-height: 46px;

    padding: 0 20px;

    border:
        1px solid rgba(185,200,215,.19);

    background:
        rgba(185,200,215,.055);

    color: #e7ecf0;

    cursor: pointer;

    font-size: 10px;
    letter-spacing: 1.7px;

    transition: .25s ease;
}

button:hover {
    background:
        rgba(185,200,215,.11);

    border-color:
        rgba(205,220,235,.34);
}

.primary {
    background:
        rgba(205,215,225,.1);
}

.bottom-links {
    display: flex;

    justify-content: center;

    gap: 28px;

    margin-top: 30px;
}

.bottom-links a {
    color: #747f8b;

    text-decoration: none;

    font-size: 10px;
    letter-spacing: 1.7px;

    transition: color .25s ease;
}

.bottom-links a:hover {
    color: #e8edf2;
}

@media(max-width:500px) {

    .panel {
        padding: 36px 23px;
    }

    h1 {
        font-size: 31px;
    }

    .actions {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .bottom-links {
        gap: 20px;
    }

}

</style>
<link rel="stylesheet" href="shared-theme.css">
</head>


<body>

<div class="panel">

    <div class="symbol">
        ⌁
    </div>

    <div class="eyebrow">
        ANOTHER PATH
    </div>

    <h1>
        A Different Way Forward
    </h1>

    <p>
        Not every door has to be opened in the same way.
        You can return to the challenge and follow the trail,
        or enter the reflection directly.
    </p>


    <div class="actions">

        <button
            class="primary"
            onclick="unlockDirectAccess()"
        >
            ENTER DIRECTLY →
        </button>

    </div>


    <div class="bottom-links">

        <a href="8b.html">
            ← GROUP 8B
        </a>

        <a href="index.html">
            ARCHIVE
        </a>

    </div>

</div>


<script>

function unlockDirectAccess() {

    /*
      Direct access unlocks Voice.

      It does NOT complete Challenge.
    */

    localStorage.setItem(
        "reflection8bUnlocked",
        "true"
    );

    localStorage.setItem(
        "reflection8bDirectUnlocked",
        "true"
    );


    /*
      Prevent challenge-completion animation.
    */

    localStorage.removeItem(
        "reflection8bJustUnlocked"
    );



    window.location.href =
        "reflection-room.html";
}

</script>

</body>
</html>
