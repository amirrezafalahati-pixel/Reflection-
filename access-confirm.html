<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Different Way Forward</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #24272a,
            #121416 45%,
            #08090a
        );

    color:#e9e6de;

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}

.panel{

    width:min(620px,100%);

    padding:50px 42px 42px;

    text-align:center;

    border:
        1px solid
        rgba(255,255,255,.14);

    background:
        rgba(255,255,255,.025);

    box-shadow:
        0 30px 100px rgba(0,0,0,.45);
}

.symbol{

    width:64px;
    height:64px;

    margin:0 auto 25px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:
        1px solid
        rgba(255,255,255,.14);

    font-size:24px;

    color:#ccc9c0;
}

.eyebrow{

    color:#73777a;

    font-family:Arial,sans-serif;

    font-size:8px;

    letter-spacing:3px;

    margin-bottom:15px;
}

h1{

    margin:0 0 18px;

    font-size:
        clamp(34px,7vw,54px);

    font-weight:normal;
}

p{

    max-width:460px;

    margin:0 auto;

    color:#9c9d98;

    line-height:1.9;
}

.buttons{

    display:flex;

    flex-direction:column;

    gap:10px;

    margin-top:32px;
}

a,
button{

    width:100%;

    min-height:50px;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:10px 20px;

    border:
        1px solid
        rgba(255,255,255,.14);

    background:
        rgba(255,255,255,.025);

    color:#d7d4cb;

    text-decoration:none;

    font-family:Arial,sans-serif;

    font-size:8px;

    letter-spacing:2px;

    cursor:pointer;

    transition:.25s;
}

a:hover,
button:hover{

    border-color:
        rgba(255,255,255,.32);

    background:
        rgba(255,255,255,.06);

    color:#fff;
}

.primary{

    background:
        rgba(255,255,255,.08);

    border-color:
        rgba(255,255,255,.24);
}

.note{

    margin-top:25px;

    color:#62676a;

    font-family:Arial,sans-serif;

    font-size:8px;

    line-height:1.8;
}

@media(max-width:600px){

    .panel{

        padding:
            38px
            23px
            30px;
    }

}

</style>

</head>


<body>


<div class="panel">


    <div class="symbol">
        ◇
    </div>


    <div class="eyebrow">
        AN ALTERNATIVE ROUTE
    </div>


    <h1>
        A Different Way Forward
    </h1>


    <p>

        There is another way into the reflection.

        <br><br>

        You can enter directly,
        but doing so means leaving
        the trail and its clues unexplored.

    </p>


    <div class="buttons">


        <a
            href="challenge.html">

            RETURN TO THE CHALLENGE →

        </a>


        <button
            class="primary"
            onclick="unlockDirectAccess()">

            ENTER DIRECTLY →

        </button>


        <a href="8b.html">

            ← BACK TO GROUP 8B

        </a>


    </div>


    <div class="note">

        The choice is yours.
        Discovery or another way forward.

    </div>


</div>


<script>

function unlockDirectAccess(){

    /*
       Direct access unlocks the
       Reflection Voice.

       It does NOT mark the Challenge
       as solved.

       Therefore the Challenge remains
       visible when returning to Group 8B.
    */

    localStorage.setItem(
        "reflection8bUnlocked",
        "true"
    );


    /*
       Separate flag used only to tell
       Group 8B to animate the opening
       of the Reflection Voice lock.
    */

    localStorage.setItem(
        "reflection8bDirectUnlocked",
        "true"
    );


    /*
       Make sure the Challenge-removal
       animation can NEVER be triggered
       by direct access.
    */

    localStorage.removeItem(
        "reflection8bJustUnlocked"
    );


    window.location.href =
        "reflection-room.html";

}

</script>

</body>

</html>
