<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Different Way Forward</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(60,80,105,.14),
            transparent 42%
        ),
        #090b0f;

    color: #e8edf2;
    font-family: Arial, sans-serif;
}

.panel {
    width: min(620px, 100%);
    padding: 45px 40px;

    border: 1px solid rgba(180,195,210,.17);

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(120,145,170,.07),
            transparent 55%
        ),
        #0c1015;

    box-shadow:
        0 35px 100px rgba(0,0,0,.45);

    text-align: center;
}

.symbol {
    font-size: 29px;
    margin-bottom: 22px;
}

.eyebrow {
    font-size: 10px;
    letter-spacing: 3px;
    color: #707d8a;
    margin-bottom: 14px;
}

h1 {
    font-family: Georgia, serif;
    font-weight: 400;
    font-size: 37px;
    margin: 0 0 17px;
}

p {
    max-width: 460px;
    margin: 0 auto;
    color: #8d98a5;
    font-size: 13px;
    line-height: 1.85;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;

    margin-top: 32px;
}

button {
    min-height: 46px;
    padding: 0 20px;

    border: 1px solid rgba(185,200,215,.2);
    background: rgba(185,200,215,.06);

    color: #e9edf2;

    font-size: 10px;
    letter-spacing: 1.7px;

    cursor: pointer;

    transition: .25s ease;
}

button:hover {
    background: rgba(185,200,215,.12);
    border-color: rgba(205,220,235,.35);
}

.primary {
    background: rgba(205,215,225,.1);
}

.back {
    margin-top: 30px;
    display: inline-block;

    color: #727f8c;
    text-decoration: none;

    font-size: 10px;
    letter-spacing: 1.8px;

    transition: .25s ease;
}

.back:hover {
    color: white;
}

@media(max-width:500px) {

    .panel {
        padding: 36px 23px;
    }

    h1 {
        font-size: 31px;
    }

    .actions {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

}

</style>
</head>

<body>

<div class="panel">

    <div class="symbol">⌁</div>

    <div class="eyebrow">
        ANOTHER PATH
    </div>

    <h1>A Different Way Forward</h1>

    <p>
        Not every door has to be opened in the same way.
        You can return to the challenge and follow the trail,
        or enter the reflection directly.
    </p>

    <div class="actions">

        <button onclick="goChallenge()">
            RETURN TO THE CHALLENGE
        </button>

        <button
            class="primary"
            onclick="unlockDirectAccess()"
        >
            ENTER DIRECTLY →
        </button>

    </div>

    <a class="back" href="8b.html">
        ← BACK TO GROUP 8B
    </a>

</div>


<script>

function goChallenge() {

    window.location.href =
        "challenge.html";

}


function unlockDirectAccess() {

    /*
      Direct access unlocks the Voice.

      It intentionally does NOT create
      reflection8bChallengeCompleted.

      Therefore Challenge remains visible.
    */

    localStorage.setItem(
        "reflection8bUnlocked",
        "true"
    );

    localStorage.setItem(
        "reflection8bDirectUnlocked",
        "true"
    );

    /*
      Make absolutely sure the
      challenge-solved animation
      cannot accidentally trigger.
    */

    localStorage.removeItem(
        "reflection8bJustUnlocked"
    );

    localStorage.removeItem(
        "reflection8bChallengeCompleted"
    );

    window.location.href =
        "reflection-room.html";
}

</script>

</body>
</html>
