body {

.container {

.option:hover {

}

.option h2 {
    font-size: 20px;
    font-weight: normal;
    letter-spacing: 2px;
}

.option p {
    color: #969792;
    font-style: italic;
    line-height: 1.7;
}

.enter {
    display: inline-block;
    margin-top: 15px;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    color: #bbb;
}

.direct {
    margin-top: 55px;
    text-align: center;
}

.direct a {
    color: #555b60;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 3px;
}

.direct a:hover {
    color: #9a9c9e;
}

@media(max-width:700px) {
    .options {
        grid-template-columns: 1fr;
    }
}
