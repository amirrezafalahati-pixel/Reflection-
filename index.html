<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Next Step</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at center,
                    #202020 0%,
                    #111111 52%,
                    #070707 100%
                );

            color: #e7e3d8;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow-x: hidden;
        }

        .container {
            width: min(90%, 720px);
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            position: relative;
            padding: 50px 20px;
        }

        .content {
            width: 100%;
        }

        .symbols {
            font-family: Georgia, serif;
            font-size: 18px;
            letter-spacing: 13px;

            color: #77746c;

            margin-bottom: 35px;

            direction: ltr;
        }

        h1 {
            margin: 0;

            font-size: clamp(34px, 9vw, 68px);

            font-weight: normal;

            letter-spacing: 8px;

            color: #e9e5dc;

            direction: ltr;
        }

        .line {
            width: 80px;
            height: 1px;

            background: #77746c;

            margin: 28px auto;

            opacity: 0.7;
        }

        .opening {
            font-size: clamp(15px, 4vw, 20px);

            line-height: 1.9;

            color: #aaa69d;

            font-style: italic;

            direction: ltr;
        }

        .continue-area {
            margin-top: 48px;
        }

        button,
        .file-link {

            background: transparent;

            border: 1px solid #66635d;

            color: #dedad0;

            padding: 13px 34px;

            font-family: Georgia, serif;

            font-size: 15px;

            letter-spacing: 2px;

            cursor: pointer;

            text-decoration: none;

            display: inline-block;

            transition:
                background 0.35s ease,
                color 0.35s ease,
                border-color 0.35s ease;

        }

        button:hover,
        .file-link:hover {

            background: #dedad0;

            color: #101010;

            border-color: #dedad0;

        }

        .hidden {
            display: none;
        }

        .reveal {
            display: block;

            animation:
                fadeIn 1.1s ease forwards;
        }

        .second-page {
            margin-top: 42px;
        }

        .second-page p {

            margin: 0 auto 30px;

            max-width: 520px;

            font-size: 17px;

            line-height: 2;

            color: #b5b1a8;

            direction: ltr;
        }

        .lock {

            margin-top: 25px;

            font-size: 18px;

            color: #77746c;

        }

        .hint {

            margin-top: 30px;

            font-size: 13px;

            line-height: 1.8;

            color: #77746c;

            font-style: italic;

            direction: ltr;

        }

        .footer {

            position: fixed;

            bottom: 16px;

            left: 0;

            width: 100%;

            text-align: center;

            font-size: 10px;

            letter-spacing: 3px;

            color: #4f4d48;

            direction: ltr;

        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @media (max-width: 500px) {

            h1 {
                letter-spacing: 5px;
            }

            .symbols {
                letter-spacing: 8px;
            }

            .footer {
                letter-spacing: 2px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <div class="content">

        <div class="symbols">
            ϟ △ ⊙ ∴ □
        </div>


        <h1>
            THE NEXT STEP
        </h1>


        <div class="line"></div>


        <div class="opening">
            Not everything revealed<br>
            is meant to be understood.
        </div>


        <div class="continue-area">

            <button onclick="continueStep()">
                CONTINUE
            </button>

        </div>


        <div id="secondPage" class="hidden">

            <div class="line"></div>


            <div class="second-page">

                <p>
                    Some answers are better discovered
                    than given.
                </p>


                <a
                    class="file-link"
                    href="Main-Reflection-8b.pdf"
                    target="_blank"
                >
                    OPEN THE FILE
                </a>


                <div class="lock">
                    ⟐
                </div>


                <div class="hint">
                    If the next door asks for a key,
                    perhaps the answer was never far away.
                </div>

            </div>

        </div>

    </div>

</div>


<div class="footer">
    THINK · QUESTION · REFLECT
</div>


<script>

    function continueStep() {

        const page =
            document.getElementById("secondPage");

        page.classList.remove("hidden");

        page.classList.add("reveal");

        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });

    }

</script>

</body>
</html>
