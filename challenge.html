<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Challenge</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #171b20 0%, #07090b 72%);
    color: #e6e3db;
    font-family: Georgia, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 18px;
}

.container {
    width: 100%;
    max-width: 700px;
    text-align: center;
}

.top {
    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 5px;
    color: #5f6469;
    margin-bottom: 30px;
}

h1 {
    font-size: clamp(40px, 9vw, 70px);
    font-weight: normal;
    letter-spacing: 7px;
    margin: 0 0 20px;
}

.line {
    width: 80px;
    height: 1px;
    background: #45494e;
    margin: 25px auto;
}

.message {
    max-width: 570px;
    margin: auto;
    color: #9c9b96;
    font-style: italic;
    font-size: 16px;
    line-height: 1.9;
}

.box {
    margin: 45px auto 0;
    max-width: 420px;
}

input {
    width: 100%;
    padding: 15px;
    background: #0b0d10;
    border: 1px solid #4b5055;
    color: #e8e5dc;
    text-align: center;
    font-family: Georgia, serif;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #85898d;
}

button {
    margin-top: 15px;
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid #555a5f;
    color: #ddd9d0;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    cursor: pointer;
}

button:hover {
    background: #ddd9d0;
    color: #101214;
}

.status {
    margin-top: 18px;
    min-height: 20px;
    color: #777;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
}

.hint {
    display: none;
    margin: 18px auto 0;
    padding: 18px;
    border: 1px solid #30353a;
    color: #8d908f;
    font-style: italic;
    line-height: 1.7;
    max-width: 500px;
}

.success {
    display: none;
    margin-top: 35px;
}

.success-title {
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 4px;
    color: #8d9296;
}

.success-key {
    margin: 15px 0;
    font-size: 19px;
    letter-spacing: 2px;
}

.success a {
    display: inline-block;
    margin-top: 15px;
    padding: 13px 25px;
    border: 1px solid #676c71;
    color: #e6e3db;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
}

.scenario {
    margin-top: 45px;
}

.scenario a {
    color: #555b60;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 3px;
}

.scenario a:hover {
    color: #9b9e9f;
}
</style>
</head>

<body>

<div class="container">

<div class="top">
FILE 08B · ACCESS POINT
</div>

<h1>THE CHALLENGE</h1>

<div class="line"></div>

<div class="message">

The answer may already be somewhere in the story.

<br><br>

Read. Observe. Reconsider.

<br><br>

When you think you have found the key,
follow it.

</div>

<div class="box">

<input
type="text"
id="key"
placeholder="Enter the key..."
autocomplete="off"
>

<button onclick="checkKey()">
UNLOCK
</button>

<div class="status" id="status"></div>

<div class="hint" id="hint"></div>

</div>

<div class="success" id="success">

<div class="success-title">
ACCESS GRANTED
</div>

<div class="success-key">
The final key was found.
</div>

<a href="Main%20Reflection%208b.pdf" target="_blank">
OPEN THE REFLECTION →
</a>

</div>

<div class="scenario">

<a href="scenario.html">
← RETURN TO THE SCENARIO
</a>

</div>

</div>

<script>

let attempts = 0;

const finalKey =
"understanding is not the final stop";

const hints = {

2: "You may have already seen the clue.",

3: "Do not assume the first answer is the final one.",

4: "Sometimes the way forward begins by looking back.",

5: "What you found may only be pointing toward another.",

6: "The first key is not the final key.",

7: "Return to what came before."
};

function checkKey() {

    const input =
    document.getElementById("key").value.trim();

    const status =
    document.getElementById("status");

    const hint =
    document.getElementById("hint");

    const success =
    document.getElementById("success");

    if (input === finalKey) {

        status.innerHTML = "";

        hint.style.display = "none";

        success.style.display = "block";

        document.getElementById("key").style.display = "none";

        document.querySelector("button").style.display = "none";

        return;
    }

    attempts++;

    status.innerHTML =
    "Incorrect key · Attempt " + attempts;

    if (attempts >= 2 && attempts <= 7) {

        hint.innerHTML =
        "<strong>HINT</strong><br><br>" +
        hints[attempts];

        hint.style.display = "block";

    }

}

</script>

</body>
</html>
