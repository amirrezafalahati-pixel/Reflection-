<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Challenge · Reflection 08B</title>

    <link rel="stylesheet" href="site.css">

</head>


<body>


<main class="page-narrow">

    <div class="challenge-shell">


        <header class="archive-header">

            <div class="eyebrow">
                Reflection 08B · Follow the Trail
            </div>

            <h1>
                Look back.
            </h1>

            <p class="subtitle">
                The message you found is not the final answer.
                It is an instruction.
            </p>

        </header>


        <section class="challenge-box">

            <label for="answer">
                Enter the final password
            </label>

            <input
                id="answer"
                class="challenge-input"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="type the answer here..."
            >


            <div class="challenge-actions">

                <button
                    id="verify"
                    class="btn primary"
                >
                    Verify →
                </button>

                <a
                    href="scenario.html"
                    class="btn secondary"
                >
                    Revisit Scenario
                </a>

            </div>


            <div
                id="message"
                class="message"
            ></div>

        </section>


        <section
            id="hintArea"
            class="hint-area"
        >

            <div class="section-label">
                Automatic Hints
            </div>

        </section>


        <section class="help-box">

            <button id="helpButton">
                Need Some Help?
            </button>

            <div id="helpArea"></div>

        </section>


        <nav class="bottom-nav">

            <a href="8b.html">
                ← Group 08B
            </a>

            <a href="scenario.html">
                ← Scenario
            </a>

        </nav>

    </div>

</main>


<script>

const FINAL_PASSWORD =
    "understanding is not the final stop";


const answerInput =
    document.getElementById("answer");

const verifyButton =
    document.getElementById("verify");

const message =
    document.getElementById("message");

const hintArea =
    document.getElementById("hintArea");

const helpButton =
    document.getElementById("helpButton");

const helpArea =
    document.getElementById("helpArea");


let attempts = 0;
let helpIndex = 0;


const automaticHints = [

    "The answer is not the rune message itself. The rune message points somewhere else.",

    "One of the messages in the scenario asks you to reconsider something you have already seen.",

    "The words “look back” are an instruction. Do not treat them as the final answer.",

    "Return to the earlier coded English sentence. There is a transformation hidden inside it.",

    "Each letter of the earlier coded sentence has been shifted. Try moving the letters backward.",

    "The final answer is a complete English sentence. It is written entirely in lowercase."

];


const progressiveHelp = [

    "Return to the scenario. The clues are part of the story, not separate from it.",

    "The strange symbols are a direction, not necessarily the final answer.",

    "The message tells you to look back. Take that instruction seriously.",

    "Go back to the earlier coded English sentence and examine it again.",

    "The coded English line uses a simple shift. Each letter has moved forward by two places.",

    "The final answer is a complete English sentence. It is written entirely in lowercase."

];


function normalize(value) {

    return value
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");

}


function showHint() {

    const index =
        Math.min(
            attempts - 1,
            automaticHints.length - 1
        );

    if (index < 0) {
        return;
    }

    const existing =
        document.getElementById("hint-" + index);

    if (existing) {
        return;
    }

    const hint =
        document.createElement("div");

    hint.className = "hint";
    hint.id = "hint-" + index;

    hint.textContent =
        automaticHints[index];

    hintArea.appendChild(hint);

}


function showHelp() {

    if (
        helpIndex >= progressiveHelp.length
    ) {
        helpButton.disabled = true;
        helpButton.textContent =
            "No More Help Available";
        return;
    }


    const help =
        document.createElement("div");

    help.className = "hint";

    help.textContent =
        progressiveHelp[helpIndex];

    helpArea.appendChild(help);

    helpIndex++;


    if (
        helpIndex < progressiveHelp.length
    ) {

        helpButton.textContent =
            "Need More Help?";

    } else {

        helpButton.disabled = true;

        helpButton.textContent =
            "No More Help Available";

    }

}


function grantAccess() {

    localStorage.setItem(
        "reflection8bUnlocked",
        "true"
    );

    document.body.innerHTML = `

        <main class="page">

            <section class="success-screen">

                <div class="success-inner">

                    <div class="success-mark">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M5 12.5l4 4L19 7"
                            />

                        </svg>

                    </div>


                    <div class="eyebrow">
                        Reflection 08B · Access
                    </div>


                    <h1>
                        Access Granted.
                    </h1>


                    <p>
                        You found the password.
                        The final reflection is now available.
                    </p>


                    <a
                        href="reflection-room.html"
                        class="btn primary"
                    >
                        Enter the Listening Archive →
                    </a>

                </div>

            </section>

        </main>

    `;

}


function verify() {

    const value =
        normalize(answerInput.value);


    if (!value) {

        message.className =
            "message error";

        message.textContent =
            "Enter the password first.";

        return;

    }


    if (value === FINAL_PASSWORD) {

        message.className =
            "message success";

        message.textContent =
            "Correct.";

        setTimeout(
            grantAccess,
            450
        );

        return;

    }


    attempts++;

    message.className =
        "message error";

    message.textContent =
        "Not quite. Look carefully at what you have already seen.";

    showHint();

}


verifyButton.addEventListener(
    "click",
    verify
);


answerInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            verify();
        }

    }
);


helpButton.addEventListener(
    "click",
    showHelp
);

</script>


</body>
</html>
